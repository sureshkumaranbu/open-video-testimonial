services:
  plaudit:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        INSTALL_FFMPEG: ${INSTALL_FFMPEG:-true}
    image: plaudit:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fallbacks so `docker compose up` works out of the box for a local try-out.
      # Set real values in .env before exposing this to the internet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SESSION_SECRET: ${SESSION_SECRET:-insecure-dev-secret-change-me-please}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
    volumes:
      - plaudit-data:/data

volumes:
  plaudit-data:
