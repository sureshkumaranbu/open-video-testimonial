name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install browsers on 26.04 (ubuntu-latest)
    # Chromium and WebKit each run the end-to-end suite against their own production build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The ownership check diffs the pull request against its base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's apt mirror is sometimes very slow (tens of KB/s), so the
      # ffmpeg packages are cached between runs: a slow mirror then costs one
      # run, not every run.
      - name: Restore cached ffmpeg packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install ffmpeg (video conversion tests)
        timeout-minutes: 20
        # Each attempt is bounded and retried; downloaded packages are kept, so
        # a retry continues where the last one stopped.
        run: |
          mkdir -p ~/apt-cache
          sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo timeout 420 apt-get install -y --no-install-recommends \
                -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
                -o APT::Keep-Downloaded-Packages=true ffmpeg; then
              break
            fi
            echo "apt-get attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true
            sleep 5
          done
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          # Last, so the step fails if ffmpeg still isn't there.
          ffmpeg -hide_banner -version > /dev/null && echo "ffmpeg is installed"
      - name: Save ffmpeg packages for next time
        if: steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Migration guards and schema drift
        run: npm run db:check
      # On a work-package branch (wp/<id>), fails if the PR changes files the
      # package doesn't own (docs/plan/ownership.json); elsewhere it checks the manifest.
      - name: Package ownership
        run: npm run check:ownership -- ${BASE_REF:+--base "origin/$BASE_REF"}
        env:
          BASE_REF: ${{ github.base_ref }}
      # A gate for all of Phase 1: every requirement ID has a test that names it.
      - name: Requirement coverage
        run: npm run check:req -- --all
      - run: npm run typecheck
      - run: npm test
      # TEAM-05: npm test runs the S3 driver against an in-process fake; this runs
      # it against a real S3 server too. The same images as docker-compose.s3.yml
      # (a service container can't be given MinIO's "server" command, so it's
      # started here). Loopback only, with throwaway credentials.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=plaudit -e MINIO_ROOT_PASSWORD=plaudit-minio-secret \
            chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host -e MC_HOST_local=http://plaudit:plaudit-minio-secret@127.0.0.1:9000 \
            chainguard/minio-client:latest mb --ignore-existing local/plaudit
      - name: S3 storage tests against MinIO
        run: npx vitest run tests/storage-minio.test.ts
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: plaudit
          S3_TEST_ACCESS_KEY_ID: plaudit
          S3_TEST_SECRET_ACCESS_KEY: plaudit-minio-secret
      - name: MinIO logs
        if: failure()
        run: docker logs minio
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (production build)
        run: npm run test:e2e
        env:
          CI: "true"
      # Safari's engine, for every spec that doesn't record video (playwright.config.ts CAMERA_SPECS, D24).
      - name: End-to-end tests in WebKit
        run: npx playwright test --project=webkit
        env:
          CI: "true"
          E2E_WEBKIT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install browsers on 26.04 (ubuntu-latest)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and start with docker compose
        run: docker compose up -d --build --wait
        env:
          ADMIN_EMAIL: owner@example.com
          ADMIN_PASSWORD: e2e-password-123
          SESSION_SECRET: ci-session-secret-ci-session-secret
          PUBLIC_URL: http://127.0.0.1:3000
          # The suite stands in for many visitors with X-Forwarded-For.
          TRUST_PROXY: "1"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_SERVER_IN_CONTAINER: "true"
      - name: Container logs
        if: always()
        run: docker compose logs
