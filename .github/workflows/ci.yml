name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (video conversion tests)
        timeout-minutes: 10
        # The runner's apt mirror is occasionally very slow. Bound each attempt and
        # retry; downloaded packages are kept, so a retry continues where it stopped.
        run: |
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get install -y --no-install-recommends \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg; then
              break
            fi
            echo "apt-get attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true
            sleep 5
          done
          ffmpeg -hide_banner -version > /dev/null && echo "ffmpeg is installed"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and start with docker compose
        run: docker compose up -d --build --wait
        env:
          ADMIN_EMAIL: owner@example.com
          ADMIN_PASSWORD: e2e-password-123
          SESSION_SECRET: ci-session-secret-ci-session-secret
          PUBLIC_URL: http://127.0.0.1:3000
          # The suite stands in for many visitors with X-Forwarded-For.
          TRUST_PROXY: "1"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_SERVER_IN_CONTAINER: "true"
      - name: Container logs
        if: always()
        run: docker compose logs
