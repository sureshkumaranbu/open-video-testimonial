name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and start with docker compose
        run: docker compose up -d --build --wait
        env:
          ADMIN_EMAIL: owner@example.com
          ADMIN_PASSWORD: e2e-password-123
          SESSION_SECRET: ci-session-secret-ci-session-secret
          PUBLIC_URL: http://127.0.0.1:3000
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
      - name: Container logs
        if: always()
        run: docker compose logs
